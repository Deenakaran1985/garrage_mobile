name: Android APK CI / CD Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native Android Project Structure
        run: flutter create --org com.autopro.garage --platforms=android -a kotlin .

      - name: Install Flutter Dependencies & Harden Transitive Gradle Plugins
        run: |
          flutter pub get
          
          # Upgrade Kotlin version in settings.gradle or build.gradle to modern 1.9.24 to support jvmToolchain directives
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "1.7.[0-9]*"/version "1.9.24"/g' android/settings.gradle || true
            sed -i 's/version "1.8.[0-9]*"/version "1.9.24"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*$/ext.kotlin_version = "1.9.24"/g' android/build.gradle || true
          fi

          # Proactively apply org.jetbrains.kotlin.android to JNI and child plugins in pub-cache to resolve 'Could not find method kotlin()'
          find "$HOME/.pub-cache" -name "build.gradle" -path "*/jni-*/android/*" -exec sed -i '1i apply plugin: "org.jetbrains.kotlin.android"' {} + || true

          # Enforce kotlin plugin application in root build.gradle subprojects
          cat << 'EOF' >> android/build.gradle
          
          subprojects {
              afterEvaluate { project ->
                  if (project.name == "jni" || project.hasProperty("android")) {
                      project.apply plugin: 'org.jetbrains.kotlin.android'
                  }
              }
          }
          EOF
          
          # Harden CI memory limits and explicitly turn off Gradle daemon & VFS watcher to eliminate 'Already watching path' exception
          cat << 'PROPS' >> android/gradle.properties

          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.daemon=false
          org.gradle.vfs.watch=false
          PROPS
          
          echo "=== Verified Gradle Configuration ==="
          head -n 25 android/build.gradle || true
          head -n 25 android/settings.gradle || true
          tail -n 10 android/gradle.properties || true

      - name: Build Android APK (Release & Direct Gradle Fallback)
        run: |
          flutter build apk --release --no-tree-shake-icons || (cd android && chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --no-watch-fs)

      - name: Locate and Organize Built APK Artifacts
        run: |
          mkdir -p final_apk_output
          find build -name "*.apk" -exec cp {} final_apk_output/ \; || true
          ls -la final_apk_output/
          if [ ! -f "final_apk_output/AutoPro_Android_Release.apk" ]; then
            APK=$(find final_apk_output -name "*.apk" | head -n 1)
            if [ -n "$APK" ]; then
              cp "$APK" final_apk_output/AutoPro_Android_Release.apk
            fi
          fi
          ls -la final_apk_output/

      - name: Upload APK Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AutoPro_Android_Release.apk
          path: final_apk_output/*.apk
          retention-days: 30
          compression-level: 0
