name: Android APK CI / CD Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native Android Project Structure
        run: flutter create --org com.autopro.garage --platforms=android .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AutoPro_Android_Release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          compression-level: 0
