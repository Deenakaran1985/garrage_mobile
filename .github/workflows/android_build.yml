name: Android APK CI / CD Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17) & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native Android Project Structure
        run: flutter create --org com.autopro.garage --platforms=android -a kotlin .

      - name: Configure High-Speed Mirrors to Bypass HTTP 429 Rate Limits
        run: |
          echo "=== Injecting JetBrains & Aliyun CDN mirrors into settings.gradle(.kts) and build.gradle(.kts) ==="
          # Inject mirrors into Kotlin DSL (.kts) files
          find android -name "*.kts" -exec sed -i 's|mavenCentral()|maven("https://cache-redirector.jetbrains.com/maven-central")\n        maven("https://cache-redirector.jetbrains.com/plugins.gradle.org/m2")\n        maven("https://maven.aliyun.com/repository/public")\n        maven("https://maven.aliyun.com/repository/google")\n        mavenCentral()|g' {} + || true

          # Inject mirrors into Groovy DSL (.gradle) files
          find android -name "*.gradle" -exec sed -i 's|mavenCentral()|maven { url "https://cache-redirector.jetbrains.com/maven-central" }\n        maven { url "https://cache-redirector.jetbrains.com/plugins.gradle.org/m2" }\n        maven { url "https://maven.aliyun.com/repository/public" }\n        maven { url "https://maven.aliyun.com/repository/google" }\n        mavenCentral()|g' {} + || true

      - name: Install Flutter Dependencies & Generate Custom Garage App Icons
        run: |
          flutter pub get
          echo "Executing flutter_launcher_icons to build native Android standard & adaptive garage icons..."
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || true

          # Aggressive cleanup: remove any leftover default Flutter bug XML vector drawables and force overwrite all mipmap images
          find android/app/src/main/res -name "ic_launcher_foreground.xml" -delete || true
          find android/app/src/main/res -name "*ic_launcher*.png" -exec cp -f assets/icon/ic_launcher.png {} + || true
          find android/app/src/main/res -name "*ic_launcher*.webp" -exec cp -f assets/icon/ic_launcher.png {} + || true
          sed -i 's/android:label=".*"/android:label="AutoPro Garage - Sri Innov Tech"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Upgrade Kotlin version in settings or build files if specified as ext or variable
          find android -type f \( -name "*.gradle*" \) -exec sed -i 's/version "1.7.[0-9]*"/version "2.0.20"/g' {} + || true
          find android -type f \( -name "*.gradle*" \) -exec sed -i 's/version "1.8.[0-9]*"/version "2.0.20"/g' {} + || true
          find android -type f \( -name "*.gradle*" \) -exec sed -i 's/version "1.9.[0-9]*"/version "2.0.20"/g' {} + || true
          find android -type f \( -name "*.gradle*" \) -exec sed -i 's/ext.kotlin_version = .*$/ext.kotlin_version = "2.0.20"/g' {} + || true

          # Proactively apply org.jetbrains.kotlin.android to JNI and child plugins in pub-cache to resolve 'Could not find method kotlin()'
          find "$HOME/.pub-cache" -name "build.gradle" -path "*/jni-*/android/*" -exec sed -i '1i apply plugin: "org.jetbrains.kotlin.android"' {} + || true

          # Harden CI memory limits and explicitly turn off Gradle daemon & VFS watcher
          cat << 'PROPS' >> android/gradle.properties
          
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.daemon=false
          org.gradle.vfs.watch=false
          PROPS
          
          echo "=== Verified Gradle Configuration ==="
          head -n 35 android/settings.gradle.kts || head -n 35 android/settings.gradle || true
          tail -n 15 android/gradle.properties || true

      - name: Compile Release & Debug APKs (With Auto-Retry for Network Limits)
        run: |
          # Use retry logic in case of temporary network rate-limits or timeouts during Maven dependency fetch
          for attempt in 1 2 3; do
            echo "=== APK Compilation Attempt #$attempt ==="
            if flutter build apk --release --no-tree-shake-icons; then
              echo "Release APK successfully built!"
              break
            else
              echo "Attempt #$attempt failed (likely due to temporary rate limits or download errors). Retrying in 15 seconds..."
              sleep 15
              if [ "$attempt" -eq 3 ]; then
                echo "Fallback: Trying debug APK compilation..."
                flutter build apk --debug || (cd android && chmod +x ./gradlew && ./gradlew assembleDebug assembleRelease --no-daemon --no-watch-fs)
              fi
            fi
          done

      - name: Recursively Discover and Stage Built APK Artifacts
        run: |
          mkdir -p final_apk_output
          # Search anywhere in the repository workspace (.build, android/app/build, etc) for compiled APKs
          find . -name "*.apk" -type f -exec cp {} final_apk_output/ \; || true
          echo "=== All Located APK Files ==="
          ls -la final_apk_output/
          
          # Ensure a unified release filename is staged for user download
          if [ ! -f "final_apk_output/AutoPro_Android_Release.apk" ]; then
            BEST_APK=$(find final_apk_output -name "*release*.apk" | head -n 1)
            if [ -z "$BEST_APK" ]; then
              BEST_APK=$(find final_apk_output -name "*.apk" | head -n 1)
            fi
            if [ -n "$BEST_APK" ]; then
              cp "$BEST_APK" final_apk_output/AutoPro_Android_Release.apk
            fi
          fi
          echo "=== Staged Artifacts Ready for Upload ==="
          ls -la final_apk_output/

      - name: Upload APK Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AutoPro_Android_Release_Package
          path: final_apk_output/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
