name: iOS IPA CI / CD Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build_ios:
    name: Build Standalone iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Apple Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter Environment (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native iOS Project Structure & CocoaPods Configuration
        run: flutter create --org com.autopro.garage --platforms=ios .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies for iOS
        run: |
          cd ios
          pod install || (pod repo update && pod install)
          cd ..

      - name: Build iOS Application Bundle (No Code Sign for CI Validation)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Standalone Installable IPA Archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r AutoPro_iOS_Release.ipa Payload
          cd ../../../

      - name: Upload Standalone IPA Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AutoPro_iOS_Release.ipa
          path: build/ios/iphoneos/AutoPro_iOS_Release.ipa
          retention-days: 30
          compression-level: 0
