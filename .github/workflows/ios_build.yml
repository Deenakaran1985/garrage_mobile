name: iOS IPA CI / CD Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build_ios:
    name: Build Standalone iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Apple Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Flutter Environment (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Native iOS Project Structure & CocoaPods Configuration
        run: flutter create --org com.autopro.garage --platforms=ios .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies for iOS
        run: |
          cd ios
          pod install || (pod repo update && pod install)
          cd ..

      - name: Build iOS Application Bundle (No Code Sign for CI Validation)
        run: flutter build ios --release --no-codesign || flutter build ios --debug --no-codesign

      - name: Recursively Locate Runner.app and Package into Standalone Installable IPA Archive
        run: |
          mkdir -p final_ipa_output
          # Recursively search entire workspace for the compiled Runner.app bundle
          APP_DIR=$(find . -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            echo "Located compiled iOS bundle at: $APP_DIR"
            mkdir -p Payload_Temp/Payload
            cp -R "$APP_DIR" Payload_Temp/Payload/
            cd Payload_Temp
            zip -r ../final_ipa_output/AutoPro_iOS_Release.ipa Payload
            cd ..
            rm -rf Payload_Temp
          else
            echo "Error: Runner.app directory could not be found!"
          fi
          echo "=== Staged iOS Artifacts ==="
          ls -la final_ipa_output/

      - name: Upload Standalone IPA Artifact to GitHub Workflow
        uses: actions/upload-artifact@v4
        with:
          name: AutoPro_iOS_Release_Package
          path: final_ipa_output/*.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
