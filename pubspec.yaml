name: garrage_flutter
description: Advanced Garage Management System Mobile App.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  provider: ^6.1.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^13.1.0"

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/ic_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/icon/ic_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
